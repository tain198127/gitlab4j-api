<!DOCTYPE html>
<html>
<head>
    <title>Test Local Chart</title>
</head>
<body>
    <canvas id="testChart" width="400" height="300"></canvas>
    <script src="chart.js"></script>
    <script>
        console.log('Chart available:', typeof Chart);
        if (typeof Chart === 'undefined') {
            alert('Chart.js is not loaded!');
        } else {
            const ctx = document.getElementById('testChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Red', 'Blue', 'Yellow'],
                    datasets: [{
                        label: '# of Votes',
                        data: [12, 19, 3],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.2)',
                            'rgba(54, 162, 235, 0.2)',
                            'rgba(255, 206, 86, 0.2)'
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
            console.log('Chart rendered:', chart);
        }
    </script>
</body>
</html>
