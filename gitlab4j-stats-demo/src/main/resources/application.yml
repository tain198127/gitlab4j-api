spring:
  application:
    name: gitlab4j-stats-demo
  datasource:
    url: jdbc:h2:mem:gitlab_stats
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

server:
  port: 8080

gitlab:
  api:
    url: https://gitlab.com/api/v4
    token: ${GITLAB_API_TOKEN:your_private_token_here}
    project-id: ${GITLAB_PROJECT_ID:0}